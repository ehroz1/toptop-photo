<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Picta — админка</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png?v=3" sizes="32x32">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-app">
  <header class="admin-header">
    <a class="admin-brand" href="index.html">← Picta</a>
    <h1>Админка</h1>
    <div id="adminWhoami" class="admin-whoami"></div>
  </header>

  <div id="adminGate" class="admin-gate">
    <p id="adminGateMessage">Проверяем доступ…</p>
    <button type="button" id="adminGoogleBtn" class="btn btn-primary" hidden>Войти через Google</button>
  </div>

  <main id="adminContent" class="admin-content" hidden>
    <section class="admin-section">
      <h2>Статистика</h2>
      <div class="admin-stats-row">
        <div class="admin-stat-card">
          <span class="admin-stat-value" id="statUsers">—</span>
          <span class="admin-stat-label">пользователей зарегистрировано</span>
        </div>
        <div class="admin-stat-card">
          <span class="admin-stat-value" id="statSearchesToday">—</span>
          <span class="admin-stat-label">поисков сегодня</span>
        </div>
      </div>
    </section>

    <section class="admin-section">
      <h2>Ключи API фотостоков</h2>
      <p class="admin-hint">Значения хранятся в Cloudflare KV и подставляются воркером при каждом запросе — без редеплоя. Пока запись в KV не сделана, используется старый секрет воркера (если задан).</p>
      <div id="keysTable" class="admin-keys-table"></div>
    </section>
  </main>
</div>

<div id="adminToast" class="toast" hidden></div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
