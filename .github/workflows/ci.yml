name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Статические проверки (синтаксис, офлайн-кэш, переводы)
        run: npm run check
      - name: Тесты логики сайта (jsdom)
        run: npm test
      - name: Установка Chromium
        run: npx playwright install --with-deps chromium
      - name: Тесты в браузере + замер скорости
        run: npm run test:e2e
