# Разовый помощник: скачивает фоновые фото с Unsplash, сжимает в WebP
# (версия для компьютера и портретная для телефона) и коммитит в images/bg.
# Из среды разработки Unsplash недоступен, а раннеры GitHub — в интернете.
name: Fetch background photos (one-off)

on:
  push:
    branches: [claude/magical-darwin-ovi7ry]
    paths: [.github/workflows/fetch-backgrounds.yml]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and optimize
        run: |
          set -e
          mkdir -p /tmp/bg images/bg
          cd /tmp/bg
          npm init -y >/dev/null
          npm install --silent sharp@0.33.5
          for id in 5hvn-2WW6rY HxCl2w7pKy0 vCzuG3W3ucA; do
            curl -sSL -A "Mozilla/5.0" -o "$id.jpg" -w "$id http=%{http_code} bytes=%{size_download} url=%{url_effective}\n" \
              "https://unsplash.com/photos/$id/download?force=true"
            file "$id.jpg"
            title=$(curl -sSL -A "Mozilla/5.0" "https://unsplash.com/photos/$id" | grep -o '<title>[^<]*' | head -1 | sed 's/<title>//') || true
            echo "$id | $title" >> credits.txt
          done
          cat > build.mjs <<'EOF'
          import sharp from "sharp";
          import fs from "fs";
          const out = process.argv[2];
          for (const id of ["5hvn-2WW6rY", "HxCl2w7pKy0", "vCzuG3W3ucA"]) {
            const src = sharp(`${id}.jpg`).rotate();
            const meta = await src.metadata();
            const { dominant } = await sharp(`${id}.jpg`).stats();
            await sharp(`${id}.jpg`).rotate().resize({ width: 1920, withoutEnlargement: true })
              .webp({ quality: 70 }).toFile(`${out}/${id}-desktop.webp`);
            await sharp(`${id}.jpg`).rotate().resize({ width: 900, height: 1600, fit: "cover", position: sharp.strategy.attention })
              .webp({ quality: 66 }).toFile(`${out}/${id}-mobile.webp`);
            const d = fs.statSync(`${out}/${id}-desktop.webp`).size, m = fs.statSync(`${out}/${id}-mobile.webp`).size;
            console.log(`${id}: original ${meta.width}x${meta.height}, desktop ${d} B, mobile ${m} B, dominant rgb(${dominant.r},${dominant.g},${dominant.b})`);
          }
          EOF
          node build.mjs "$GITHUB_WORKSPACE/images/bg"
          cp credits.txt "$GITHUB_WORKSPACE/images/bg/credits.txt"
          cat credits.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/bg
          git commit -m "Add optimized background photos from Unsplash (WebP, desktop + mobile)"
          git push origin HEAD:claude/magical-darwin-ovi7ry
